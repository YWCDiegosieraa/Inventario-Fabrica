<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="CarpinStock Pro - Sistema de inventario para fábrica de carpintería">
  <link rel="manifest" href="manifest.json?v=4">
  <link rel="icon" href="assets/logo.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=4">
  <title>CarpinStock Pro | Inventario</title>
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Desarrollo local: elimina registros de Service Worker/cache de versiones anteriores. -->
  <script>
    (async function cleanupLegacyWorker() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('carpinstock-')).map(key => caches.delete(key)));
        }
      } catch (error) {
        console.warn('No fue posible limpiar la caché anterior:', error);
      }
    })();
  </script>

  <script src="js/data/initial-data.js?v=4"></script>
  <script src="js/core/storage.js?v=4"></script>
  <script src="js/core/auth.js?v=4"></script>
  <script src="js/modules/dashboard.js?v=4"></script>
  <script src="js/modules/inventory.js?v=4"></script>
  <script src="js/modules/melamine.js?v=4"></script>
  <script src="js/modules/movements.js?v=4"></script>
  <script src="js/modules/audit.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
