<!doctype html><html lang="es"><head><meta charset="utf-8"><script>
window.__errors=[]; window.addEventListener('error',e=>window.__errors.push(e.error?.stack||e.message)); window.addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason?.stack||e.reason)));
</script></head><body><div id="app"></div><div id="toast-root"></div>
<script src="js/data/initial-data.js?v=test"></script>
<script src="js/core/storage.js?v=test"></script>
<script src="js/core/auth.js?v=test"></script>
<script src="js/modules/dashboard.js?v=test"></script>
<script src="js/modules/inventory.js?v=test"></script>
<script src="js/modules/melamine.js?v=test"></script>
<script src="js/modules/movements.js?v=test"></script>
<script src="js/modules/audit.js?v=test"></script>
<script src="js/app.js?v=test"></script>
<script>
setTimeout(()=>{
  const form=document.getElementById('login-form');
  form.querySelector('[name=username]').value='admin'; form.querySelector('[name=password]').value='admin123';
  form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  setTimeout(()=>{
    const routes=['dashboard','inventario','movimientos','melaminas','auditoria'];
    let out={};
    let i=0;
    function next(){
      if(i>=routes.length){ document.body.setAttribute('data-result',JSON.stringify({out,errors:window.__errors})); document.body.innerHTML='<pre id="result">'+document.body.getAttribute('data-result')+'</pre>'; return; }
      const r=routes[i++];
      window.CarpiApp.navigate(r);
      setTimeout(()=>{out[r]=(document.getElementById('content')?.innerHTML||'').length; next();},50);
    }
    next();
  },50);
},50);
</script></body></html>
